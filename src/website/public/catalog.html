<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4ead9">
  <meta name="description" content="Catalogul Zarad — selecție de condimente inspirate de Maroc.">
  <title>Catalog — Zarad</title>
  <link rel="icon" type="image/png" href="/assets/Zarad-logo.png">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body class="catalog-page">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Zarad — One Spice Away">
        <img id="zarad_logo" src="/assets/Zarad-logo.png" alt="Zarad — One Spice Away" width="128" height="72">
      </a>

      <nav class="main-nav" aria-label="Navigare principală">
        <a class="nav-link" href="/" data-ro="Acasă" data-en="Home">Acasă</a>
        <a class="nav-link active" href="/catalog" aria-current="page" data-ro="Catalog" data-en="Catalogue">Catalog</a>
        <a class="nav-link" href="/#contact" data-ro="Contact" data-en="Contact">Contact</a>
      </nav>

      <button class="language-toggle" id="zarad_language" type="button" aria-label="Switch to English" title="English">EN</button>
    </div>
  </header>

  <main class="catalog-main">
    <section class="catalog-heading">
      <p class="section-kicker" data-ro="ONE SPICE AWAY" data-en="ONE SPICE AWAY">ONE SPICE AWAY</p>
      <h1 data-ro="Catalogul Zarad" data-en="The Zarad catalogue">Catalogul Zarad</h1>
      <p data-ro="O selecție de condimente și amestecuri inspirate de aromele Marocului. Descoperă-le și lasă-ți imaginația să aleagă următoarea rețetă." data-en="A selection of spices and blends inspired by the flavours of Morocco. Explore them and let your imagination choose the next recipe.">O selecție de condimente și amestecuri inspirate de aromele Marocului. Descoperă-le și lasă-ți imaginația să aleagă următoarea rețetă.</p>
    </section>

    <section class="catalog-content" aria-label="Produse Zarad">
      <div class="catalog-grid" id="zarad_catalog" aria-live="polite"></div>
      <p class="catalog-status" id="zarad_catalog_status" hidden data-ro="Catalogul nu a putut fi încărcat. Reîncarcă pagina." data-en="The catalogue could not be loaded. Please refresh the page.">Catalogul nu a putut fi încărcat. Reîncarcă pagina.</p>
    </section>
  </main>

  <footer class="site-footer">
    <a class="footer-brand" href="/" aria-label="Zarad — One Spice Away">
      <img src="/assets/Zarad-logo.png" alt="Zarad">
    </a>
    <p>One Spice Away</p>
    <a class="footer-contact" href="mailto:salut@zarad.ro">salut@zarad.ro</a>
    <span class="footer-copy">© <span id="current-year"></span> Zarad</span>
  </footer>
</body>
</html>
